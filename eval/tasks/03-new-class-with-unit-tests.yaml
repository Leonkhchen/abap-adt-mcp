# 新建 class + ABAP Unit 到全綠
id: "03"
title: 新建 class + ABAP Unit 全綠
prompt: |
  請在 $TMP 建立 class ZCL_EVAL03_{{SFX}},提供公開方法 word_count:
  輸入一個字串(TYPE string),回傳以空白分隔的單字數(TYPE i);前後與連續的空白不算,空字串回傳 0。
  另外寫 ABAP Unit 測試(至少 3 個測試方法,涵蓋一般句子、空字串、連續空白),啟用後執行到全部通過。
setup: []
checks:
  - kind: tool
    tool: run_unit_tests
    args: { object_url: /sap/bc/adt/oo/classes/zcl_eval03_{{sfx}} }
    contains: ["✅ ABAP Unit", " 0 失敗"]
  - kind: tool
    tool: class_components
    args: { object_url: /sap/bc/adt/oo/classes/zcl_eval03_{{sfx}} }
    contains: ["WORD_COUNT"]
cleanup:
  - /sap/bc/adt/oo/classes/zcl_eval03_{{sfx}}
