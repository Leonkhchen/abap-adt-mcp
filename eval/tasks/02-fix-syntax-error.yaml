# 修語法錯誤:事前以 skip_syntax_check 寫入一個有語法錯誤的 class(inactive)
id: "02"
title: 修語法錯誤
prompt: |
  $TMP 裡的 class ZCL_EVAL02_{{SFX}} 有語法錯誤,無法啟用。
  請找出錯誤並修正,讓它啟用成功;執行它(run_class)時要輸出 EVAL-02-OK。
setup:
  - tool: create_object
    args: { object_type: CLAS/OC, name: ZCL_EVAL02_{{SFX}}, package_name: $TMP, description: eval 02 syntax error }
  - tool: write_source
    args:
      object_url: /sap/bc/adt/oo/classes/zcl_eval02_{{sfx}}
      skip_syntax_check: true
      new_source: |
        CLASS zcl_eval02_{{sfx}} DEFINITION PUBLIC FINAL CREATE PUBLIC.
          PUBLIC SECTION.
            INTERFACES if_oo_adt_classrun.
        ENDCLASS.

        CLASS zcl_eval02_{{sfx}} IMPLEMENTATION.
          METHOD if_oo_adt_classrun~main.
            DATA(message) = `EVAL-02-OK`
            out->write( message ).
          ENDMETHOD.
        ENDCLASS.
checks:
  - kind: tool
    tool: run_class
    args: { class_name: ZCL_EVAL02_{{SFX}} }
    contains: ["EVAL-02-OK"]
cleanup:
  - /sap/bc/adt/oo/classes/zcl_eval02_{{sfx}}
